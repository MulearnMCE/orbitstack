version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbitstack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbitstack
      POSTGRES_PASSWORD: orbitstack_dev
      POSTGRES_DB: orbitstack
    ports:
      - '5432:5432'
    volumes:
      - orbitstack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbitstack']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orbitstack_pgdata:
